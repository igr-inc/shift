<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script>window.API_URL = "https://script.google.com/macros/s/AKfycbwuhfTswbINU-qrllaBw1pWzq54Z172iT-UTZw_CEhkkWR4I8L5u6gkH80CZH2MYTjVkg/exec";</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>カードショップあるぱか 営業日のお知らせ画像（X投稿用）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
  :root { --bg: #FBF8F1; --card: #FFFFFF; --ink: #22303C; --muted: #6B7787; --line: #E6E0D2; --brand: #C9822B; --brand-ink: #6B3F0B; --brand-soft: #FBEAD3; --danger: #C0392B; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif; font-size: 15px; line-height: 1.5; padding: 0 16px 40px; max-width: 560px; margin: 0 auto; -webkit-text-size-adjust: 100%; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 0 10px; }
  .cat { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); display: grid; place-items: center; flex: none; }
  .cat svg { width: 22px; height: 22px; }
  h1 { font-size: 16px; margin: 0; line-height: 1.2; }
  header small { display: block; color: var(--muted); font-size: 12px; font-weight: 500; }
  .ctl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 6px 0 10px; }
  .seg { display: flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); }
  .seg button { border: 0; background: transparent; padding: 8px 18px; font: inherit; font-weight: 700; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--brand); color: #1f1a00; }
  .save { border: 0; background: var(--ink); color: #fff; border-radius: 12px; padding: 10px 18px; font: inherit; font-weight: 700; cursor: pointer; }
  .save:disabled { opacity: .5; }
  .hint { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
  .err { color: var(--danger); font-weight: 700; }
  .wrap { margin: 0; }
  canvas { display: none; }
  img { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 18px rgba(34,48,60,.08); background: #fff; }
  .foot { font-size: 12px; color: var(--muted); margin-top: 12px; }
  /* 見本づくり（?sample=1）：画像だけを 1080×1350 で出す */
  body.sample { max-width: none; padding: 0; margin: 0; background: #fff; }
  body.sample header, body.sample .ctl, body.sample .hint, body.sample .foot { display: none; }
  body.sample img { width: 1080px; height: 1350px; border: 0; border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<header>
  <div class="cat" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#2b1d0e" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M8 5l1 3M16 5l-1 3"/><path d="M7 9c0-1.5 2-2.5 5-2.5s5 1 5 2.5v3.5c0 2.5-2 4.5-5 4.5s-5-2-5-4.5z"/><path d="M9.5 17.5v2M14.5 17.5v2"/><circle cx="10" cy="11.5" r=".9" fill="#2b1d0e"/><circle cx="14" cy="11.5" r=".9" fill="#2b1d0e"/><path d="M11 14.5c.6.5 1.4.5 2 0"/></svg></div>
  <div><h1>営業日のお知らせ画像（X投稿用）</h1><small>カードショップあるぱか</small></div>
</header>
<div class="ctl">
  <div class="seg" role="group" aria-label="対象の月"><button type="button" id="m0" aria-pressed="true" onclick="load(0)">今月</button><button type="button" id="m1" aria-pressed="false" onclick="load(1)">来月</button></div>
  <button type="button" class="save" id="save" onclick="save()" disabled>画像を保存（PNG）</button>
</div>
<p class="hint" id="hint">読み込み中…</p>
<div class="wrap"><canvas id="c" width="1080" height="1350"></canvas><img id="img" alt="営業日のお知らせ画像"></div>
<p class="foot">「休業カレンダー」シートの内容（定休日・臨時休業・祝日）からその場で作ります。営業時間の文は「設定」シートの「X画像の営業時間」、下の一言は「X画像のひとこと」で変えられます。スマホで保存されないときは画像を長押し →「写真に追加」。X への投稿は手動で行ってください。</p>

<script>
  var BRAND = '#C9822B', BRAND_INK = '#6B3F0B', BRAND_SOFT = '#FBEAD3';
  var W = 1080, H = 1350, cur = 0, data = null;
  var q = new URLSearchParams(location.search);
  if (q.get('sample')) { document.body.className = 'sample'; window.MOCK = { getNotice: sampleData }; }

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function api(fn, arg) {
    return new Promise(function (res, rej) {
      if (window.MOCK) { setTimeout(function () { try { res(window.MOCK[fn](arg)); } catch (e) { rej(e); } }, 50); }
      else if (window.API_URL) {
        // クッキーを送らずに呼ぶ（複数アカウントのログインで開けなくなるのを防ぐ。index.html と同じ）
        fetch(window.API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, arg: arg }), credentials: 'omit', redirect: 'follow' })
          .then(function (r) { if (!r.ok) throw new Error('サーバーに接続できません（' + r.status + '）'); return r.json(); })
          .then(function (j) { j.ok ? res(j.result) : rej(new Error(j.error)); })
          .catch(rej);
      } else rej(new Error('サーバーに接続できません'));
    });
  }
  function monthOf(off) { var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + off); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
  function label(m) { return (+m.slice(0, 4)) + '年' + (+m.slice(5, 7)) + '月'; }
  function loadFonts() {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    return Promise.all(['500 30px', '700 44px', '900 78px'].map(function (s) { return document.fonts.load(s + ' "Zen Kaku Gothic New"', '営業日のお知らせ0123'); })).catch(function () {});
  }

  function load(off) {
    cur = off;
    $('m0').setAttribute('aria-pressed', off === 0); $('m1').setAttribute('aria-pressed', off === 1);
    $('hint').textContent = '読み込み中…'; $('save').disabled = true;
    var month = q.get('month') || monthOf(off);
    Promise.all([api('getNotice', { month: month }), loadFonts()]).then(function (r) {
      data = r[0];
      draw(data);
      $('hint').textContent = label(data.month) + ' の営業日（' + (data.generated ? data.generated + ' 時点の' : '') + '休業カレンダーから）。定休日・臨時休業を直すときは「休業カレンダー」シートで変えてから開き直してください。';
      $('save').disabled = false;
    }).catch(function (e) {
      $('hint').innerHTML = '<span class="err">読み込めませんでした：' + esc(e && e.message ? e.message : e) + '</span>';
    });
  }

  function rrect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  // 長い文を幅に合わせて折り返す（1文字ずつ測る）
  function wrapText(ctx, text, maxW) {
    var lines = [], line = '';
    String(text).split('\n').forEach(function (para) {
      line = '';
      for (var i = 0; i < para.length; i++) {
        var t = line + para.charAt(i);
        if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = para.charAt(i); } else line = t;
      }
      lines.push(line);
    });
    return lines;
  }

  /** 1080×1350（Xの縦投稿用 4:5）の営業日カレンダーを描く */
  function draw(d) {
    var cv = $('c'), ctx = cv.getContext('2d');
    var F = function (w, px) { return w + ' ' + px + 'px "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif'; };
    var y = +d.month.slice(0, 4), mo = +d.month.slice(5, 7);
    var INK = '#22303C', MUTED = '#6B7787', RED = '#C0392B', BLUE = '#1D5FB4', GRAY = '#8A8474';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    // 上の帯（店の色）
    ctx.fillStyle = BRAND; ctx.fillRect(0, 0, W, 230);
    ctx.fillStyle = '#1f1a00';
    ctx.font = F(700, 40); ctx.fillText(d.storeName, 60, 86);
    ctx.font = F(900, 78); ctx.fillText(mo + '月の営業日のお知らせ', 60, 184);
    // 見出しの下
    ctx.fillStyle = MUTED; ctx.font = F(500, 30);
    var sub = y + '年' + mo + '月　' + (d.closedWdLabel ? '毎週' + d.closedWdLabel + '曜日は定休日' : '定休日なし') + (d.closedWdLabel && d.holidayOpen ? '（祝日は営業します）' : '');
    ctx.fillText(sub, 60, 292);
    // カレンダー
    var gx = 60, gy = 318, cw = 960 / 7, hh = 50, ch = 104;
    var wdn = ['日', '月', '火', '水', '木', '金', '土'], wdc = [RED, INK, INK, INK, INK, INK, BLUE];
    ctx.font = F(700, 28); ctx.textAlign = 'center';
    wdn.forEach(function (w, i) { ctx.fillStyle = wdc[i]; ctx.fillText(w, gx + cw * i + cw / 2, gy + 34); });
    ctx.strokeStyle = '#E6E0D2'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(gx, gy + hh); ctx.lineTo(gx + 960, gy + hh); ctx.stroke();
    var off = d.days.length ? wdn.indexOf(d.days[0].wd) : 0, rows = Math.ceil((off + d.days.length) / 7);
    d.days.forEach(function (day, i) {
      var idx = off + i, r = Math.floor(idx / 7), c = idx % 7;
      var x = gx + cw * c + 4, yy = gy + hh + 8 + r * ch, w = cw - 8, h = ch - 8;
      var temp = day.closed && day.closedLabel === '臨時休業', reg = day.closed && !temp;
      rrect(ctx, x, yy, w, h, 14);
      ctx.fillStyle = temp ? '#FFD9D3' : (reg ? '#E6E0D2' : '#FFFFFF'); ctx.fill();
      if (!day.closed) { ctx.strokeStyle = '#E6E0D2'; ctx.lineWidth = 2; ctx.stroke(); }
      var col = temp ? RED : (reg ? GRAY : (c === 0 || day.holiday ? RED : (c === 6 ? BLUE : INK)));
      ctx.fillStyle = col; ctx.font = F(700, 44); ctx.fillText(String(day.day), x + w / 2, yy + 54);
      ctx.font = F(700, 20);
      if (day.closed) ctx.fillText(day.closedLabel, x + w / 2, yy + 86);
      else if (day.holiday) { ctx.fillStyle = RED; ctx.fillText('祝日', x + w / 2, yy + 86); }
    });
    var ly = gy + hh + 8 + rows * ch + 40;
    // 凡例
    ctx.textAlign = 'left'; ctx.font = F(700, 26); var lx = 60;
    [['#E6E0D2', '定休日' + (d.closedWdLabel ? '（毎週' + d.closedWdLabel + '曜日）' : '')], ['#FFD9D3', '臨時休業']].forEach(function (l) {
      rrect(ctx, lx, ly - 24, 30, 30, 6); ctx.fillStyle = l[0]; ctx.fill(); ctx.strokeStyle = '#D5CFC0'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = INK; ctx.fillText(l[1], lx + 42, ly);
      lx += 42 + ctx.measureText(l[1]).width + 44;
    });
    // 営業時間
    ly += 60;
    ctx.fillStyle = MUTED; ctx.font = F(700, 26); ctx.fillText('営業時間', 60, ly);
    ly += 50;
    ctx.fillStyle = INK; ctx.font = F(700, 40);
    wrapText(ctx, d.hours || '', 960).forEach(function (t, i) { ctx.fillText(t, 60, ly + i * 52); if (i) ly += 52; });
    // 一言
    if (d.note) {
      ly += 54; ctx.fillStyle = MUTED; ctx.font = F(500, 28);
      wrapText(ctx, d.note, 960).forEach(function (t, i) { ctx.fillText(t, 60, ly + i * 40); });
    }
    // 下の帯
    ctx.fillStyle = BRAND_SOFT; ctx.fillRect(0, H - 70, W, 70);
    ctx.fillStyle = MUTED; ctx.font = F(700, 26); ctx.textAlign = 'left'; ctx.fillText(d.storeName, 60, H - 26);
    if (d.xHandle) { ctx.textAlign = 'right'; ctx.fillText(d.xHandle, W - 60, H - 26); }
    ctx.textAlign = 'left';
    $('img').src = cv.toDataURL('image/png');
  }

  function save() {
    var cv = $('c'), name = '営業日のお知らせ_' + (data ? data.month : '') + '.png';
    var go = function (href) { var a = document.createElement('a'); a.href = href; a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); }, 2000); };
    if (cv.toBlob) cv.toBlob(function (b) { var u = URL.createObjectURL(b); go(u); setTimeout(function () { URL.revokeObjectURL(u); }, 5000); }, 'image/png');
    else go(cv.toDataURL('image/png'));
    $('hint').textContent = '保存しました（ダウンロード）。保存されないスマホでは、画像を長押し →「写真に追加」。';
  }

  // 見本用の仮データ（?sample=1&month=YYYY-MM）。実際の画面では使わない
  function sampleData(arg) {
    var m = (arg && arg.month) || '2026-10';
    var y = +m.slice(0, 4), mo = +m.slice(5, 7), last = new Date(y, mo, 0).getDate();
    var temp = { '2026-10-13': 1, '2026-10-26': 1, '2026-10-27': 1, '2026-10-28': 1, '2026-10-29': 1, '2026-10-30': 1, '2026-11-03': 1 };
    var hol = { '2026-10-12': 'スポーツの日', '2026-11-03': '文化の日', '2026-11-23': '勤労感謝の日' };
    var wdn = ['日', '月', '火', '水', '木', '金', '土'], closedWd = '水';
    var days = [];
    for (var d = 1; d <= last; d++) {
      var dt = new Date(y, mo - 1, d), key = m + '-' + ('0' + d).slice(-2), wd = wdn[dt.getDay()], h = hol[key] || '';
      var reg = wd === closedWd && !h, t = !!temp[key];
      days.push({ date: key, day: d, wd: wd, holiday: h, closed: reg || t, closedLabel: t ? '臨時休業' : (reg ? '定休日' : '') });
    }
    return { storeName: 'カードショップあるぱか', xHandle: '@cardshop_alpaca', month: m, closedWdLabel: closedWd, holidayOpen: true, hours: '13:00〜20:00（買取受付は19:00まで）', note: q.get('note') || '', days: days };
  }

  load(+(q.get('m') || 0));
</script>
</body>
</html>
